{% extends "base.html" %}

{% block title %}Додати аплікатор - Система обліку{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <h1 class="mb-4">Додати новий аплікатор</h1>

            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="code" class="form-label">Код аплікатора</label>
                            <input type="text" class="form-control" id="code" name="code" required placeholder="APP-0001">
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Назва</label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="Опис аплікатора">
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('applicators.list_applicators') }}" class="btn btn-outline-secondary">Скасувати</a>
                            <button type="submit" class="btn btn-primary">Додати</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
